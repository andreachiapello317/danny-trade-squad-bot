# Ogni 5 minuti, solo nella fascia UTC che copre le 15–22 ora italiana
# (CET e CEST). Lo script salta se Europe/Rome è fuori da quell’orario.
# Secret obbligatorio: TELEGRAM_BOT_TOKEN
# Secret opzionale: TELEGRAM_CHAT_ID (default -1003929227957)
name: watch

on:
  schedule:
    - cron: "*/5 13-21 * * *"
  workflow_dispatch:
    inputs:
      ignore_window:
        description: "Forza un ciclo anche fuori dalle 15–22 italiane"
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            watchlist.json
            watch_state.json
          key: watch-state
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Un ciclo (Telegram + Yahoo)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.ignore_window }}" = "true" ]; then
            extra="--ignore-window"
          fi
          python watch.py run --once $extra
