# Ogni 5 minuti, solo nella fascia UTC che copre le 15–22 ora italiana
# (CET e CEST). Lo script salta se Europe/Rome è fuori da quell’orario.
# Secret obbligatorio: TELEGRAM_BOT_TOKEN
# Secret opzionale: TELEGRAM_CHAT_ID (default -1003929227957)
name: watch

on:
  schedule:
    - cron: "*/5 13-21 * * *"
  workflow_dispatch:
    inputs:
      ignore_window:
        description: "Forza un ciclo anche fuori dalle 15–22 italiane"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: pip install -r requirements.txt
      - name: Un ciclo (Telegram + Yahoo)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.ignore_window }}" = "true" ]; then
            extra="--ignore-window"
          fi
          python watch.py run --once $extra
      - name: Salva watchlist e stato su git
        if: always()
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add watchlist.json watch_state.json
          git diff --staged --quiet || git commit -m "Aggiorna stato watchlist [skip ci]"
          git push origin HEAD:main
